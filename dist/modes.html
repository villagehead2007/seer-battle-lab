<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择对战实验台</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="modes.css"><script defer src="launcher-page.js"></script></head>
<body><main class="shell"><section class="heading"><div><h1>选择对战实验台</h1><p>选择本机同屏、人机或局域网对战。</p></div></section>
<section class="settings"><h2>单精灵实验台</h2><p>双方各选一只精灵，逐回合对战。</p><a class="button primary" href="./">进入单精灵实验台</a></section>
<section class="settings"><h2>多精灵实验台</h2><p>每方 1～6 只，支持首发、主动换宠和阵亡补位。组队时会列出尚未实现的队伍词条。</p><a class="button primary" href="index.html?mode=team">进入多精灵实验台</a></section>
<section class="settings"><h2>人机对战</h2><p>组建双方队伍，由你指挥 A 方，电脑指挥 B 方。</p><a class="button primary" href="index.html?mode=team#cpu">进入人机对战</a></section>
<section class="settings" id="lan-lobby"><h2>局域网双人对战</h2><p>每人组建 1～6 只精灵的队伍。双方锁定行动后，由房主电脑结算。</p>
<button id="open-room" class="button primary">局域网开房</button>
<div id="room-info" hidden>
<a id="enter-host" class="button primary" target="_blank" rel="noopener">房主进入 A 方</a>
<div id="invitation"><label for="invite-url" id="invite-purpose"></label><small id="network-name"></small>
<div class="invite-row"><textarea id="invite-url" readonly rows="2" spellcheck="false"></textarea><button id="copy-invite" class="button secondary">复制邀请链接</button></div></div>
<details id="other-networks"><summary>其他网卡地址</summary><div id="alternatives"></div></details>
<div class="room-tools"><div><small>在这台电脑上测试双人对战</small><a id="local-guest" target="_blank" rel="noopener">本机 B 方入口</a></div><button type="button" id="close-room">关闭房间</button></div></div><p id="room-feedback" role="status"></p>
</section></main><script src="lan-launch.js"></script></body></html>
